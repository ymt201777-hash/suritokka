<style>
  :root {
    --ink: #0e0c0a;
    --cream: #f4efe6;
    --warm-mid: #c8b89a;
    --warm-light: #e8dfd0;
    --serif-jp: 'Noto Serif JP', 'ヒラギノ明朝 ProN', serif;
    --serif-en: 'Cormorant Garamond', Georgia, serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: var(--serif-jp);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  button, input { font-family: inherit; }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  .school {
    font-weight: 200; font-size: 12px; letter-spacing: 0.2em;
    opacity: 0.7;
  }
  .label-en {
    font-family: var(--serif-en); font-style: italic; font-weight: 300;
    font-size: 14px; letter-spacing: 0.08em; opacity: 0.55;
    margin-top: 40px;
  }
  h1 {
    font-weight: 300; font-size: 24px; letter-spacing: 0.08em; line-height: 1.6;
    margin-top: 8px;
  }
  .date {
    margin-top: 20px; padding: 16px 20px;
    border: 1px solid rgba(14, 12, 10, 0.15);
    font-size: 15px; letter-spacing: 0.06em; line-height: 1.8;
  }
  .date strong { font-weight: 400; }

  .step {
    margin-top: 44px;
    font-size: 13px; letter-spacing: 0.12em; opacity: 0.6;
  }

  .name-input {
    width: 100%; margin-top: 12px;
    padding: 14px 16px; font-size: 16px;
    background: #fff; color: var(--ink);
    border: 1px solid rgba(14, 12, 10, 0.2); border-radius: 0;
    outline: none;
  }
  .name-input:focus { border-color: var(--ink); }

  .slots {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    margin-top: 12px;
  }
  .slot {
    padding: 14px 8px;
    font-size: 15px; letter-spacing: 0.04em;
    background: #fff; color: var(--ink);
    border: 1px solid rgba(14, 12, 10, 0.2);
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .slot:hover:not(:disabled) { border-color: var(--ink); }
  .slot.selected { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .slot:disabled {
    background: var(--warm-light); color: rgba(14, 12, 10, 0.35);
    border-color: transparent; cursor: not-allowed;
  }
  .slot small { display: block; font-size: 11px; margin-top: 2px; letter-spacing: 0.1em; }

  .status { margin-top: 12px; font-size: 13px; opacity: 0.6; }
  .error { margin-top: 20px; font-size: 14px; line-height: 1.8; color: #9a2b1f; }

  .submit {
    width: 100%; margin-top: 36px;
    padding: 18px; font-size: 15px; letter-spacing: 0.2em;
    background: var(--ink); color: var(--cream);
    border: 1px solid var(--ink); cursor: pointer;
    transition: opacity 0.2s;
  }
  .submit:disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>

<main class="wrap">
  <p class="school">犬山数学理科特化塾</p>
  <p class="label-en">Silver Week Course</p>
  <h1>シルバーウイーク講習<br>対策面談の予約</h1>
  <div class="date"><strong>9月21日（月・祝）</strong>12:00〜19:00<br>1枠30分です。<br>予約後の時間の変更は、原則できません。</div>

  <section id="form-area">
    <p class="step">1. 名前（フルネーム）</p>
    <input id="name" class="name-input" type="text" autocomplete="name" placeholder="例）犬山 太郎">

    <p class="step">2. 時間を選ぶ</p>
    <div id="slots" class="slots"></div>
    <p id="status" class="status">空き状況を読み込んでいます…</p>

    <p id="error" class="error" hidden></p>

    <button id="submit" class="submit" type="button" disabled>この時間で予約する</button>
  </section>
</main>

<script>
// GAS の Web アプリ URL（sw-mendan-gas.gs をデプロイして発行されたもの）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyPL6EmIq41lthFDdMZQb1kbf4tqwkLw3LmRB3iadZm4gb9aQk8wQ6UVmnym5j-kyjNjQ/exec';

const DATE_LABEL = '9月21日（月・祝）';
const SLOTS = [];
for (let m = 12 * 60; m < 19 * 60; m += 30) {
  const fmt = t => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  SLOTS.push({ id: fmt(m), label: fmt(m) + '〜' + fmt(m + 30) });
}

const $name = document.getElementById('name');
const $slots = document.getElementById('slots');
const $status = document.getElementById('status');
const $error = document.getElementById('error');
const $submit = document.getElementById('submit');

let booked = new Set();
let selected = null;
let sending = false;

function render() {
  $slots.innerHTML = '';
  SLOTS.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'slot' + (selected === s.id ? ' selected' : '');
    const taken = booked.has(s.id);
    b.disabled = taken;
    b.innerHTML = s.label + (taken ? '<small>予約済み</small>' : '');
    b.addEventListener('click', () => { selected = s.id; render(); });
    $slots.appendChild(b);
  });
  updateSubmit();
}

function updateSubmit() {
  $submit.disabled = sending || !selected || !$name.value.trim();
}

function showError(msg) {
  $error.textContent = msg;
  $error.hidden = !msg;
}

async function loadBooked() {
  const res = await fetch(GAS_URL + '?t=' + Date.now());
  const data = await res.json();
  booked = new Set(data.booked || []);
  if (selected && booked.has(selected)) selected = null;
  const left = SLOTS.filter(s => !booked.has(s.id)).length;
  $status.textContent = left ? '空き ' + left + ' 枠' : 'すべての枠が埋まりました。塾に直接連絡してください。';
  render();
}

async function submit() {
  const name = $name.value.trim();
  if (!name || !selected) return;
  const slot = SLOTS.find(s => s.id === selected);
  if (!confirm(DATE_LABEL + ' ' + slot.label + '\n' + name + ' さん\n\nこの内容で予約しますか？')) return;

  sending = true;
  $submit.textContent = '送信中…';
  updateSubmit();
  showError('');

  try {
    // text/plain で送ると GAS へのプリフライトが発生しない
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ slot: selected, name: name })
    });
    const data = await res.json();

    if (data.ok) {
      // 完了ページで表示するため、URL ではなく sessionStorage で渡す
      try {
        sessionStorage.setItem('sw-mendan', JSON.stringify({ slot: DATE_LABEL + ' ' + slot.label, name: name }));
      } catch (e) {}
      location.href = '/sw-mendan-complete';
      return;
    }

    if (data.reason === 'taken') {
      showError('ごめんなさい、その時間はたった今ほかの人が予約しました。別の時間を選んでください。');
      selected = null;
    } else {
      showError('予約できませんでした。時間をおいてもう一度試すか、塾に直接連絡してください。');
    }
    await loadBooked();
  } catch (e) {
    showError('通信に失敗しました。電波の良いところでもう一度試すか、塾に直接連絡してください。');
  } finally {
    sending = false;
    $submit.textContent = 'この時間で予約する';
    updateSubmit();
  }
}

$name.addEventListener('input', updateSubmit);
$submit.addEventListener('click', submit);

render();
if (GAS_URL.startsWith('YOUR_')) {
  $status.textContent = '（準備中）GAS の URL が未設定です。';
} else {
  loadBooked().catch(() => {
    $status.textContent = '';
    showError('空き状況を読み込めませんでした。ページを再読み込みしてください。');
  });
}
</script>

</body>
</html>
